
name: Actualizare meciuri

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Descarca repository
        uses: actions/checkout@v4

      - name: Preia meciurile
        env:
          API_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          DATE=$(date -u +%F)
          curl -sS "https://v3.football.api-sports.io/fixtures?date=$DATE" \
            -H "x-apisports-key: $API_KEY" \
            -o fixtures.json

      - name: Salveaza rezultatele
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fixtures.json
          git diff --cached --quiet || git commit -m "Actualizare meciuri"
          git push
